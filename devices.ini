; Your boards, one env each (written by tools/flash.py; edit by hand if you like).
; platformio.ini loads this file (extra_configs). IDs must be unique: 1-100.

[env:chalet100]
extends = env:cabin
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_OFFSHORE
    -D NODE_ID=100
    '-D NODE_NAME="Chalet"'
    -D HAS_LOCAL_SENSOR=false

[env:hub1_sonar]
extends = env:hub
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_ONSHORE
    -D NODE_ID=1
    '-D NODE_NAME="Hub 1"'
    -D HAS_LOCAL_SENSOR=true
    -D SONAR_REAL=1
