; Your boards, one env each (written by tools/flash.py; edit by hand if you like).
; platformio.ini loads this file (extra_configs). IDs must be unique: 1-100.

[env:chalet100]
extends = env:cabin
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_OFFSHORE
    -D NODE_ID=100
    '-D NODE_NAME="Chalet"'
    -D HAS_LOCAL_SENSOR=false
[env:hub1_sonar]
extends = env:hub
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_ONSHORE
    -D NODE_ID=1
    '-D NODE_NAME="Hub 1"'
    -D HAS_LOCAL_SENSOR=true
    -D SONAR_REAL=1
    ; D181: this board has the wire from GPIO40 to the XL6009 enable pin (chip pin 2): enable pin 40, converter off
    ; while each ping listens (D173), 50 ms settle after a sleep (D178). Written by tools/flash.py --gate.
    -D SONAR_EN_WIRE=1
[env:hub1_sonar_bench]
extends = env:hub
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_ONSHORE
    -D NODE_ID=1
    '-D NODE_NAME="Hub 1"'
    -D HAS_LOCAL_SENSOR=true
    -D SONAR_REAL=1
    -D SONAR_BENCH=1
    -D BENCH_RING_BYTES=10240
    ; D181: this board has the wire from GPIO40 to the XL6009 enable pin (chip pin 2): enable pin 40, converter off
    ; while each ping listens (D173), 50 ms settle after a sleep (D178). Written by tools/flash.py --gate.
    -D SONAR_EN_WIRE=1
[env:hub1]
extends = env:hub
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_ONSHORE
    -D NODE_ID=1
    '-D NODE_NAME="Hub 1"'
    -D HAS_LOCAL_SENSOR=true

[env:hole2_sonar]
extends = env:sensor_wroom
build_flags =
    -D NODE_ID=2
    '-D NODE_NAME="Hole 2"'
    -D BOARD_ESP32WROOM
    -D SONAR_REAL=1
    ; D181 / D196: XL6009 enable wire on D13 (GPIO13): converter driven HIGH while the sonar runs, LOW in sleep
    -D SONAR_EN_WIRE=1
    ; D208: ESP-NOW receive windows (receiver on 35 ms of every 100 while the sonar streams). Both flags or none;
    ; remove the two lines to go back to the receiver always on. Field build only (the bench build runs a hotspot).
    -D ESPNOW_RX_WINDOWS=1
    -D CONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE=1

[env:hole2_sonar_bench]
extends = env:sensor_wroom
build_flags =
    -D NODE_ID=2
    '-D NODE_NAME="Hole 2"'
    -D BOARD_ESP32WROOM
    -D SONAR_REAL=1
    -D SONAR_BENCH=1
    ; D181 / D196: XL6009 enable wire on D13 (GPIO13): converter driven HIGH while the sonar runs, LOW in sleep
    -D SONAR_EN_WIRE=1
