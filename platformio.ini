; Ice fishing tip-up mesh — PlatformIO project (decisions D2, D3, D7 in docs/decisions.md)
;
; Build one board:   pio run -e hub            Flash:   pio run -e hub -t upload
; Serial monitor:    pio device monitor -e hub
; Host unit tests:   pio test -e native        (or: make -C test, plain g++)
;
; One env per role. For several boards of the same role, copy an env and change NODE_ID /
; NODE_NAME, e.g. [env:hub2] extends = env:hub ... (IDs must be unique network-wide).

[platformio]
default_envs = hub, cabin, sensor_c3

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[esp32_common]
platform = espressif32 @ 7.0.1          ; = Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4.7)
framework = arduino
monitor_speed = 115200

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) — all LoRa roles
[heltec_v3]
extends = esp32_common
board = heltec_wifi_lora_32_V3
upload_speed = 921600
build_src_filter = +<lora_node/>
extra_scripts = pre:tools/gen_web.py      ; web/suite.html -> src/lora_node/web_suite.h
lib_deps =
    jgromes/RadioLib @ 7.7.1
    olikraus/U8g2 @ 2.36.18
    bblanchon/ArduinoJson @ 6.21.6

; ---------------------------------------------------------------------------
; LoRa roles (Heltec V3)
; TODO Frank: set NODE_ID / NODE_NAME to the values your boards use today.
; ---------------------------------------------------------------------------
[env:hub]                                ; on the ice: ESP-NOW hub + LoRa + own tip-up
extends = heltec_v3
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_ONSHORE
    -D NODE_ID=1
    '-D NODE_NAME="Gateway Ice"'
    -D HAS_LOCAL_SENSOR=true

[env:cabin]                              ; in the cabin: LoRa sink + web page + display
extends = heltec_v3
build_flags =
    -D NODE_ROLE=ROLE_GATEWAY_OFFSHORE
    -D NODE_ID=100                       ; TODO Frank: real ID
    '-D NODE_NAME="Cabin"'
    -D HAS_LOCAL_SENSOR=false

[env:relay]
extends = heltec_v3
build_flags =
    -D NODE_ROLE=ROLE_RELAY_LORA
    -D NODE_ID=90                        ; TODO Frank: real ID
    '-D NODE_NAME="Relay"'
    -D HAS_LOCAL_SENSOR=false

[env:sensor_lora]
extends = heltec_v3
build_flags =
    -D NODE_ROLE=ROLE_SENSOR_LORA
    -D NODE_ID=50                        ; TODO Frank: real ID
    '-D NODE_NAME="Sensor LoRa"'
    -D HAS_LOCAL_SENSOR=true

; ---------------------------------------------------------------------------
; Tip-up nodes (ESP-NOW only, deep sleep)
; ---------------------------------------------------------------------------
[env:sensor_c3]                          ; ESP32-C3 Super Mini
extends = esp32_common
board = esp32-c3-devkitm-1
build_src_filter = +<sensor_node/>
build_flags =
    -D BOARD_ESP32C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1         ; = "USB CDC On Boot: Enabled" in the Arduino IDE
    -D NODE_ID=2
    '-D NODE_NAME="Hole 2"'

[env:sensor_wroom]                       ; classic ESP32 WROOM devkit
extends = esp32_common
board = esp32dev
build_src_filter = +<sensor_node/>
build_flags =
    -D BOARD_ESP32WROOM
    -D NODE_ID=3                         ; TODO Frank: real ID
    '-D NODE_NAME="Hole 3"'

[env:sensor_wroom_sonar]                 ; WROOM tip-up WITH the Open Echo TUSS4470 shield (real sonar, D43)
extends = env:sensor_wroom               ; driver written blind: see docs/SONAR_DRIVER.md before the first ping
build_flags =
    -D BOARD_ESP32WROOM
    -D NODE_ID=3                         ; TODO Frank: real ID
    '-D NODE_NAME="Hole 3"'
    -D SONAR_REAL=1

[env:sensor_wroom_sonar_bench]           ; bucket test: same + real sonar from boot, no hub, BENCH line every 2 s
extends = env:sensor_wroom_sonar         ; pio run -e sensor_wroom_sonar_bench -t upload -t monitor
build_flags =
    -D BOARD_ESP32WROOM
    -D NODE_ID=3
    '-D NODE_NAME="Hole 3"'
    -D SONAR_REAL=1
    -D SONAR_BENCH=1

; ---------------------------------------------------------------------------
; Host-side unit tests (lib/IceMesh), no ESP32 needed
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -Wall -Wextra     ; C++11 strictness is checked by `make -C test` (-std=c++11 -pedantic)
